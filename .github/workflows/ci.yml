# .github/workflows/ci.yml - drop-in for any uv-managed FDE repo
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=src --cov-report=xml
      - name: SBOM
        run: uv run cyclonedx-py environment --output-file sbom.cyclonedx.json
