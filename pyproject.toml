[project]
name = "acmecorp-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shivarao18", email = "shiva.thummanapalli@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
acmecorp-agent = "acmecorp_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
